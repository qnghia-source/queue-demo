<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt Bàn - Mì Kung Fu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  
  <style>
    /* Toàn bộ cấu hình CSS Reset & Layout an toàn */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500; /* Montserrat Medium */
      background-color: #821111; /* Màu đỏ nền thương hiệu */
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Container khóa cứng chiều ngang tối đa an toàn */
    .app-container {
      width: 100%;
      max-width: 430px; /* Chuẩn thông dụng iPhone */
      min-height: 100vh;
      background-image: url('bg-chinese.png'); /* 3 chữ tiếng Trung nền chìm */
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      position: relative;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Trạng thái đổi hình trang trí khi thành công */
    .app-container.order-view .bg-decor-order { display: block; }
    .app-container.order-view .bg-decor-success { display: none; }
    .app-container.success-view .bg-decor-order { display: none; }
    .app-container.success-view .bg-decor-success { display: block; }

    /* Bộ chuyển đổi ngôn ngữ */
    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .lang-btn {
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.2s;
    }
    .lang-btn.active {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Header thương hiệu */
    .store-header {
      text-align: center;
      margin-top: 15px;
      margin-bottom: 2px;
      position: relative;
      z-index: 5;
    }
    .store-title-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      object-fit: contain;
    }
    .address {
      text-align: center;
      color: #f4f2e5; /* Chữ địa chỉ màu kem nhạt */
      font-size: 14px;
      margin-bottom: 5px;
      font-weight: 500;
      position: relative;
      z-index: 5;
    }

    /* --- LAYOUT TRANG TRÍ HOẠ TIẾT LỚP TRÊN --- */
    
    /* Trang Đặt Bàn: Đũa và mì */
    .dua-va-mi-box {
      width: calc(100% + 48px); /* Tràn lề phải */
      margin-left: -24px; /* Căn lề trái */
      padding-left: 45px; /* Cách lề trái xa hơn các khối khác */
      margin-top: 5px;
      margin-bottom: -5px; /* Ép sát để dính khớp vào nút chọn giới tính bên dưới */
      position: relative;
      z-index: 2;
    }
    .dua-va-mi-box img {
      width: 100%;
      display: block;
    }

    /* Trang Thành Công: Đũa và dimsum */
    .dua-va-dimsum-box {
      width: calc(100% + 120px); /* Tăng chiều ngang để dịch trái thoải mái */
      margin-left: -75px; /* Dịch hẳn sang trái để miếng dimsum vào trung tâm */
      margin-top: -55px; /* Đẩy cao lên đè nhẹ lên phần địa chỉ / header */
      margin-bottom: -45px; /* Để khối Cảm ơn đè lên miếng dimsum */
      position: relative;
      z-index: 1;
    }
    .dua-va-dimsum-box img {
      width: 100%;
      display: block;
    }

    /* --- CÁC THÀNH PHẦN INPUT & KHỐI CHỨC NĂNG --- */
    
    .input-group {
      position: relative;
      width: 100%;
      margin-top: 12px;
      z-index: 4;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px 16px 12px 46px; /* Nhường chỗ cho icon bên trái */
      border-radius: 12px;
      border: none;
      background-color: #f4f2e5; /* Màu be kem nhạt thiết kế */
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: #333;
      outline: none;
    }
    
    /* Chọn giới tính Anh/Chị dính liền sợi mì */
    .gender-selector {
      display: flex;
      gap: 12px;
      margin-top: 0px;
      position: relative;
      z-index: 4;
    }
    .gender-btn {
      flex: 1;
      padding: 11px 14px;
      border: none;
      background-color: #f4f2e5;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      color: #333;
    }
    .gender-btn .avatar-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .gender-btn .status-icon {
      margin-left: auto; /* Đẩy icon check về bên phải */
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    /* --- NÚT BẤM CỦA HỆ THỐNG --- */
    
    button.main-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 2px solid #f4f2e5; /* Đường viền be kem nhạt */
      border-radius: 15px; /* Bo góc mềm mại */
      background: rgba(81, 6, 9, 0.85); /* Đỏ sậm xuyên thấu nhìn thấy chữ chìm phía sau */
      color: #f4f2e5;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; /* Montserrat Bold */
      font-size: 18px;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 4;
      position: relative;
      transition: background 0.2s;
    }
    button.main-btn:disabled {
      background: rgba(120, 120, 120, 0.6);
      border-color: rgba(244, 242, 229, 0.5);
      color: rgba(244, 242, 229, 0.6);
      cursor: not-allowed;
    }

    /* Nút xem Menu lớn */
    .menu-link-large {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 15px 0 20px 0;
      text-decoration: none;
      background-color: #f4f2e5;
      color: #333;
      padding: 13px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      z-index: 4;
      position: relative;
    }
    .menu-link-large img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    /* Khối thành công đè lên Dimsum */
    .success-box {
      background-color: #f4f2e5;
      padding: 16px;
      border-radius: 16px;
      margin-top: 0px;
      position: relative;
      z-index: 4;
      width: 100%;
    }
    .success-title-flex {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
      text-align: center;
    }
    .success-title-flex img {
      width: 18px;
      height: 18px;
    }
    /* Cấu trúc 3 cột thông tin sạch sẽ */
    .success-columns {
      display: flex;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding-bottom: 12px;
      margin-bottom: 10px;
    }
    .success-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #555;
    }
    .success-col:not(:last-child) {
      border-right: 1px solid rgba(0,0,0,0.1);
    }
    .success-col img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      margin-bottom: 4px;
    }
    .success-col span {
      color: #000;
      font-size: 12px;
      margin-top: 2px;
    }
    .success-notice {
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      color: #666;
    }

    /* Khu vực Ý kiến khách hàng */
    .feedback-section {
      width: 100%;
      margin-top: 0px;
      z-index: 4;
      position: relative;
    }
    .feedback-section .input-group {
      margin-top: 5px;
    }
    .feedback-section textarea {
      padding: 12px 16px; 
      height: 75px;
      resize: none;
    }

    /* ĐÁY MÀN HÌNH - KHU VỰC TRANG TRÍ PANDA VÀ WIFI */
    .bottom-decor-area {
      margin-top: auto; /* Đẩy sát xuống đáy container */
      position: relative;
      width: calc(100% + 48px);
      margin-left: -24px;
      z-index: 1;
    }
    
    /* Ảnh gấu và bát mì trang đặt bàn (Rộng 80%, dính lề trái) */
    .panda-bow-box {
      width: 80%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      position: relative;
    }
    .panda-bow-box img {
      width: 100%;
      display: block;
    }
    /* Khối text Wifi Pass ở dưới thấp hơn hình panda-bow khoảng 60%, chữ to hơn */
    .wifi-info-overlay {
      position: absolute;
      left: calc(100% + 10px); /* Đẩy ra phía bên phải của bát mì */
      bottom: 60%; /* Vị trí cao tương ứng khoảng 60% hình gấu */
      white-space: nowrap;
      color: #f4f2e5; /* Đổi sang màu chữ kem để hiển thị rõ ràng trên nền đỏ */
      font-size: 13.5px; /* Tăng kích thước font chữ to lên */
      font-weight: 700;
      line-height: 1.5;
      text-align: left;
    }

    /* Ảnh gấu và xửng dimsum trang thành công (Rộng 80%, dính lề phải) */
    .panda-dimsum-box {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }
    .panda-dimsum-box img {
      width: 80%; /* Giảm kích thước còn 80% */
      display: block;
    }
  </style>
</head>
<body>

<div class="app-container order-view" id="mainAppContainer">
  
  <div class="lang-switcher">
    <button class="lang-btn" id="lang-vi" onclick="switchLanguage('vi')" title="Tiếng Việt">🇻🇳</button>
    <button class="lang-btn" id="lang-en" onclick="switchLanguage('en')" title="English">🇬🇧</button>
  </div>

  <div class="store-header">
    <img src="logo-mikungfu.png" alt="Mì Kung Fu" class="store-title-img" />
  </div>
  <div id="storeAddress" class="address"></div>

  <div class="bg-decor-order">
    <div class="dua-va-mi-box">
      <img src="dua-va-mi.png" alt="Đũa và mì" />
    </div>
  </div>
  
  <div class="bg-decor-success">
    <div class="dua-va-dimsum-box">
      <img src="dua-va-dimsum.png" alt="Đũa và dimsum" />
