<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đặt Bàn - Mì Kung Fu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  
  <style>
    /* Toàn bộ cấu hình CSS Reset & Layout an toàn */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500; /* Montserrat Medium */
      background-color: #821111; /* Màu đỏ nền thương hiệu */
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* Container khóa cứng chiều ngang tối đa an toàn */
    .app-container {
      width: 100%;
      max-width: 430px; /* Chuẩn thông dụng iPhone */
      min-height: 100vh;
      background-image: url('bg-chinese.png'); /* 3 chữ tiếng Trung nền chìm */
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      position: relative;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Trạng thái đổi hình trang trí khi thành công */
    .app-container.order-view .bg-decor-order { display: block; }
    .app-container.order-view .bg-decor-success { display: none; }
    .app-container.success-view .bg-decor-order { display: none; }
    .app-container.success-view .bg-decor-success { display: block; }

    /* Bộ chuyển đổi ngôn ngữ */
    .lang-switcher {
      position: absolute;
      top: 20px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .lang-btn {
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.2s;
    }
    .lang-btn.active {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Header thương hiệu */
    .store-header {
      text-align: center;
      margin-top: 15px;
      margin-bottom: 2px;
    }
    .store-title-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      object-fit: contain;
    }
    .address {
      text-align: center;
      color: #f4f2e5; /* Chữ địa chỉ tiệp màu kem nhạt nổi bật trên nền đỏ */
      font-size: 14px;
      margin-bottom: 5px;
      font-weight: 500;
    }

    /* --- LAYOUT TRANG TRÍ HOẠ TIẾT LỚP TRÊN --- */
    
    /* Trang Đặt Bàn: Đũa và mì */
    .dua-va-mi-box {
      width: calc(100% + 48px); /* Tràn lề phải */
      margin-left: -24px; /* Căn lề trái */
      padding-left: 45px; /* Cách lề trái xa hơn các khối khác */
      margin-bottom: -15px;
      margin-top: 5px;
    }
    .dua-va-mi-box img {
      width: 100%;
      display: block;
    }

    /* Trang Thành Công: Đũa và dimsum */
    .dua-va-dimsum-box {
      width: 75%; /* CHỈNH SỬA: Cho nhỏ đũa gắp lại */
      margin-left: -15%; /* CHỈNH SỬA: Dịch hẳn sang lề trái 25% (từ -48px ban đầu dịch thêm sang trái) */
      margin-top: -10px;
      margin-bottom: -45px; /* Để khối Cảm ơn đè lên miếng dimsum */
      position: relative;
      z-index: 1;
    }
    .dua-va-dimsum-box img {
      width: 100%;
      display: block;
    }

    /* --- CÁC THÀNH PHẦN INPUT & KHỐI CHỨC NĂNG --- */
    
    .input-group {
      position: relative;
      width: 100%;
      margin-top: 12px;
      z-index: 2;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px 16px 12px 46px; /* Nhường chỗ cho icon bên trái */
      border-radius: 12px;
      border: none;
      background-color: #f4f2e5; /* Màu be kem nhạt thiết kế */
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 14px;
      color: #333;
      outline: none;
    }
    
    /* Custom lại giới tính Anh/Chị dạng dính liền sợi mì */
    .gender-selector {
      display: flex;
      gap: 12px;
      margin-top: 0px;
      position: relative;
      z-index: 3;
    }
    .gender-btn {
      flex: 1;
      padding: 11px 14px;
      border: none;
      background-color: #f4f2e5;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      color: #333;
    }
    .gender-btn .avatar-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .gender-btn .status-icon {
      margin-left: auto; /* Đẩy icon check về bên phải */
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    /* --- NÚT BẤM CỦA HỆ THỐNG (CSS THUẦN BIẾN ĐỔI THÔNG MINH) --- */
    
    button.main-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 2px solid #f4f2e5; /* Đường viền be kem nhạt */
      border-radius: 15px; /* Bo góc mềm mại */
      background: #510609; /* CHỈNH SỬA: Đổi màu thành đỏ thẫm cố định, bỏ rgba xuyên thấu gây nhờ mầu */
      color: #f4f2e5;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; /* Montserrat Bold */
      font-size: 18px;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 2;
      position: relative;
      transition: background 0.2s;
    }
    button.main-btn:disabled {
      background: rgba(120, 120, 120, 0.6);
      border-color: rgba(244, 242, 229, 0.5);
      color: rgba(244, 242, 229, 0.6);
      cursor: not-allowed;
    }

    /* CHỈNH SỬA: Thêm class riêng cho nút Gửi ý kiến để tạo độ trong suốt mờ ảo nhìn xuyên nền */
    button#submitFeedbackBtn {
      background: rgba(81, 6, 9, 0.65) !important; /* Đỏ thẫm kết hợp opacity nhìn xuyên background */
    }

    /* Nút xem Menu lớn */
    .menu-link-large {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0 5px 0;
      text-decoration: none;
      background-color: #f4f2e5;
      color: #333;
      padding: 13px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      z-index: 2;
      position: relative;
    }
    /* CHỈNH SỬA: Đặt icon menu ra góc ngoài cùng bên trái */
    .menu-link-large img {
      position: absolute;
      left: 16px;
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    /* CHỈNH SỬA: Giữ chữ MENU căn giữa tuyệt đối */
    .menu-link-large span {
      margin: 0 auto;
    }

    /* Khối chữ tiếng trung nhỏ trang trí */
    .chinese-decor-wrap {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 5px;
      display: flex;
      z-index: 2;
      position: relative;
    }
    .chinese-decor-wrap img {
      height: 45px;
      object-fit: contain;
    }
    /* Vị trí chữ Trung Quốc nhỏ ở 2 trang */
    .app-container.order-view .chinese-decor-wrap { justify-content: flex-end; padding-right: 15px; }
    .app-container.success-view .chinese-decor-wrap { justify-content: flex-start; padding-left: 15px; margin-top: 8px; }

    /* Khối thành công đè lên Dimsum */
    .success-box {
      background-color: #f4f2e5;
      padding: 16px;
      border-radius: 16px;
      margin-top: 0px;
      position: relative;
      z-index: 2;
      width: 100%;
    }
    .success-title-flex {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #333;
      margin-bottom: 12px;
      text-align: center;
    }
    .success-title-flex img {
      width: 18px;
      height: 18px;
    }
    /* Cấu trúc 3 cột thông tin sạch sẽ */
    .success-columns {
      display: flex;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      padding-bottom: 12px;
      margin-bottom: 10px;
    }
    .success-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #555;
    }
    .success-col:not(:last-child) {
      border-right: 1px solid rgba(0,0,0,0.1);
    }
    .success-col img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      margin-bottom: 4px;
    }
    .success-col span {
      color: #000;
      font-size: 12px;
      margin-top: 2px;
    }
    .success-notice {
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      line-height: 1.4;
      color: #666;
    }

    /* Khu vực Ý kiến khách hàng */
    .feedback-section {
      width: 100%;
      margin-top: 0px;
      z-index: 2;
      position: relative;
    }
    .feedback-section .input-group {
      margin-top: 5px;
    }
    .feedback-section textarea {
      padding: 12px 16px; /* Ý kiến khách hàng không có icon trái */
      height: 75px;
      resize: none;
    }

    /* ĐÁY MÀN HÌNH - KHU VỰC ĐẤM ĐUỐI TRANG TRÍ CỦA PANDA VÀ WIFI */
    .bottom-decor-area {
      margin-top: auto; /* Đẩy sát xuống đáy container */
      position: relative;
      width: calc(100% + 48px);
      margin-left: -24px;
      z-index: 1;
    }
    
    /* CHỈNH SỬA: Sửa phần đũa mì/bát gấu trang đặt bàn dính khít viền dưới nút MENU */
    .app-container.order-view .bottom-decor-area {
      margin-top: -10px; /* CHỈNH SỬA: Kéo ngược khối đáy dính sát vào viền nút Menu trên */
    }
    .panda-bow-box {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      position: relative;
    }
    .panda-bow-box img {
      width: 100%; /* CHỈNH SỬA: Cho ảnh giãn hết 100% chiều ngang như yêu cầu */
      display: block;
    }
    /* Khối text Wifi Pass đè lên đúng góc phải cái bát */
    .wifi-info-overlay {
      position: absolute;
      right: 30px;
      bottom: 22px;
      color: #333;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
      text-align: left;
    }

    /* CHỈNH SỬA: Sửa phần dimsum/gấu trang thành công dính khít viền dưới nút Gửi ý kiến */
    .app-container.success-view .bottom-decor-area {
      margin-top: -10px; /* CHỈNH SỬA: Dịch chuyển tịnh tiến sát lên trên viền nút */
    }
    .panda-dimsum-box {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }
    .panda-dimsum-box img {
      width: 100%; /* CHỈNH SỬA: To hết chiều ngang màn hình */
      display: block;
    }
  </style>
</head>
<body>

<div class="app-container order-view" id="mainAppContainer">
  
  <div class="lang-switcher">
    <button class="lang-btn" id="lang-vi" onclick="switchLanguage('vi')" title="Tiếng Việt">🇻🇳</button>
    <button class="lang-btn" id="lang-en" onclick="switchLanguage('en')" title="English">🇬🇧</button>
  </div>

  <div class="store-header">

  <div id="storeAddress" class="address"></div>

  <div class="bg-decor-order">
    <div class="dua-va-mi-box">
      <img src="dua-va-mi.png" alt="Đũa và mì" />

  </div>
  
  <div class="bg-decor-success">
    <div class="dua-va-dimsum-box">
      <img src="dua-va-dimsum.png" alt="Đũa và dimsum" />

  </div>

  <div id="bookingFormWrapper">
    <div class="gender-selector">
      <button type="button" class="gender-btn" id="btnAnh" onclick="selectGender('Anh')">

        <img src="gender-notpicked.png" id="iconAnh" class="status-icon" alt="status" />
      </button>
      <button type="button" class="gender-btn" id="btnChi" onclick="selectGender('Chị')">

        <img src="gender-notpicked.png" id="iconChi" class="status-icon" alt="status" />

    <div class="input-group">
      <img src="panda-icon.png" class="input-icon" alt="User" />
      <input type="text" id="name" placeholder="Tên của bạn" />

    <div class="input-group">
      <img src="panda-icon-3.png" class="input-icon" alt="Guests" />
      <input type="number" id="guestCount" placeholder="Số lượng khách" />
    </div>

    <div class="input-group">
      <img src="icon-phone.png" class="input-icon" alt="Phone" />
      <input type="tel" id="phone" placeholder="Số điện thoại" />
    </div>
    
    <button id="submitBtn" class="main-btn" disabled>Đặt bàn</button>
  </div>

  <div id="successMessage" style="display: none;" class="success-box">
    <div class="success-title-flex">
      <img src="gender-picked.png" alt="Success" />
      <span id="textSuccessTitle">CẢM ƠN BẠN ĐÃ ĐẶT HÀNG</span>
    </div>
    
    <div class="success-columns">
      <div class="success-col">
        <img src="panda-icon.png" alt="User" />
        <span id="colNameVal">-</span>
      </div>
      <div class="success-col">
        <img src="panda-icon-3.png" alt="Guests" />
        <span id="colCountVal">- khách</span>
      </div>
      <div class="success-col">
        <img src="icon-phone.png" alt="Phone" />
        <span id="colPhoneVal">-</span>
      </div>
    </div>
    
    <div id="successNotice" class="success-notice"></div>
  </div>

  <a class="menu-link-large" id="btnMenuLarge" href="https://m.me/110354707866871?ref=.f.af475c640ccd4ab49bce4414c91603bf" target="_blank">
    <img src="icon-menu.png" alt="Menu Icon" />
    <span>MENU</span>
  </a>

  <div class="chinese-decor-wrap">
    <img src="icon-chinese.png" alt="Chữ trung quốc nhỏ" />
  </div>

  <div class="feedback-section" id="feedbackSectionWrapper" style="display: none;">
    <input type="text" value="Ý KIẾN KHÁCH HÀNG" id="textFeedbackTitle" style="background:transparent; padding:0; font-weight:700; font-size:14px; color:#f4f2e5; height:auto;" disabled />
    <div class="input-group">
      <textarea id="feedbackContent" rows="3" placeholder="Nhập ý kiến đóng góp của bạn tại đây..."></textarea>
    </div>
    <button id="submitFeedbackBtn" class="main-btn">Gửi ý kiến</button>
  </div>

  <div class="bottom-decor-area">
    
    <div class="bg-decor-order">
      <div class="panda-bow-box">
        <img src="panda-bow.png" alt="Panda ôm bát mì" />
        <div class="wifi-info-overlay">
          wifi: MIKUNGFU<br>Pass: 12346789
        </div>
      </div>
    </div>
    
    <div class="bg-decor-success">
      <div class="panda-dimsum-box">
        <img src="panda-dimsum.png" alt="Panda và xửng dimsum" />
      </div>
    </div>

  </div>

</div>

<script>
// Giữ nguyên 100% cấu hình & Logic xử lý dữ liệu Firebase
const firebaseConfig = {
  apiKey: "AIzaSyD_hZDfeIR575b7n5Cshp1VRZg2y--raiw",
  authDomain: "mykungfu-31485.firebaseapp.com",
  databaseURL: "https://mykungfu-31485-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mykungfu-31485",
  storageBucket: "mykungfu-31485.firebasestorage.app",
  messagingSenderId: "830853417821",
  appId: "1:830853417821:web:f336fb6f4cc7660b7d36b4"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const storesConfig = {
  kungfu: { name: 'Mì Kung Fu', address: '124B Đường 2/9' },
  kungfu2: { name: 'Mì Kung Fu', address: '225 Đường Nguyễn Văn Thoại' }
};

const dictionary = {
  vi: {
    placeholderName: "Tên của bạn",
    placeholderGuest: "Số lượng khách",
    placeholderPhone: "Số điện thoại",
    btnSubmit: "ĐẶT BÀN",
    successTitle: "CẢM ƠN BẠN ĐÃ ĐẶT HÀNG",
    btnMenu: "MENU",
    feedbackTitle: "Ý KIẾN KHÁCH HÀNG",
    placeholderFeedback: "Nhập ý kiến đóng góp của bạn tại đây...",
    btnFeedback: "GỬI Ý KIẾN",
    titleAnh: "Anh",
    titleChi: "Chị",
    alertFeedbackEmpty: "Vui lòng nhập nội dung ý kiến trước khi gửi!",
    alertFeedbackSuccess: "Gửi ý kiến đóng góp thành công. Cảm ơn bạn!",
    alertFeedbackError: "Không thể gửi ý kiến lúc này. Vui lòng thử lại!",
    alertBookingError: "Đã xảy ra lỗi kết nối mạng. Vui lòng thử lại!",
    labelGuests: "khách",
    labelPhone: "SĐT",
    noticeLines: "KHI ĐẾN LƯỢT NHÂN VIÊN SẼ<br>MỜI QUÝ KHÁCH VÀO BÀN"
  },
  en: {
    placeholderName: "Your Name",
    placeholderGuest: "Number of Guests",
    placeholderPhone: "Phone Number",
    btnSubmit: "BOOK A TABLE",
    successTitle: "THANK YOU FOR YOUR ORDER",
    btnMenu: "MENU",
    feedbackTitle: "CUSTOMER FEEDBACK",
    placeholderFeedback: "Enter your feedback or suggestions here...",
    btnFeedback: "SUBMIT FEEDBACK",
    titleAnh: "Mr.",
    titleChi: "Ms.",
    alertFeedbackEmpty: "Please enter your feedback before submitting!",
    alertFeedbackSuccess: "Feedback submitted successfully. Thank you!",
    alertFeedbackError: "Could not submit feedback at this time. Please try again!",
    alertBookingError: "Network connection error. Please try again!",
    labelGuests: "guests",
    labelPhone: "Phone",
    noticeLines: "OUR STAFF WILL INVITE YOU IN<br>WHEN IT IS YOUR TURN"
  }
};

let currentLang = localStorage.getItem('kungfu_lang') || 'vi';

let params = new URLSearchParams(window.location.search);
let storeKey = params.get('store');

if (!storeKey || !storesConfig[storeKey]) {
  storeKey = 'kungfu';
  const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?store=kungfu';
  window.history.replaceState({ path: newUrl }, '', newUrl);
}

const currentStore = storesConfig[storeKey];
document.getElementById('storeAddress').innerText = currentStore.address;

const d = new Date();
const tzOffset = 7 * 60 * 60 * 1000;
const localDate = new Date(d.getTime() + tzOffset);
const today = localDate.toISOString().split('T')[0];

let selectedGender = '';
let customerSubmittedName = '';
let customerSubmittedPhone = '';

function switchLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('kungfu_lang', lang);
  
  document.getElementById('lang-vi').classList.toggle('active', lang === 'vi');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  
  const langData = dictionary[lang];
  document.getElementById('name').placeholder = langData.placeholderName;
  document.getElementById('guestCount').placeholder = langData.placeholderGuest;
  document.getElementById('phone').placeholder = langData.placeholderPhone;
  document.getElementById('submitBtn').innerText = langData.btnSubmit;
  document.getElementById('textSuccessTitle').innerText = langData.successTitle;
  document.getElementById('btnMenuLarge').querySelector('span').innerText = langData.btnMenu;
  document.getElementById('textFeedbackTitle').value = langData.feedbackTitle;
  document.getElementById('feedbackContent').placeholder = langData.placeholderFeedback;
  document.getElementById('submitFeedbackBtn').innerText = langData.btnFeedback;
  document.getElementById('textAnh').innerText = langData.titleAnh;
  document.getElementById('textChi').innerText = langData.titleChi;
  
  document.getElementById('successNotice').innerHTML = langData.noticeLines;
  
  if (customerSubmittedName) {
    updateSuccessBoxDisplay();
  }
}

function selectGender(gender) {
  selectedGender = gender;
  const btnAnh = document.getElementById('btnAnh');
  const btnChi = document.getElementById('btnChi');
  const iconAnh = document.getElementById('iconAnh');
  const iconChi = document.getElementById('iconChi');

  if (gender === 'Anh') {
    btnAnh.style.backgroundColor = '#f4f2e5';
    btnChi.style.backgroundColor = 'rgba(244, 242, 229, 0.4)'; // Làm mờ nút không chọn
    iconAnh.src = 'gender-picked.png';
    iconChi.src = 'gender-notpicked.png';
  } else {
    btnChi.style.backgroundColor = '#f4f2e5';
    btnAnh.style.backgroundColor = 'rgba(244, 242, 229, 0.4)'; // Làm mờ nút không chọn
    iconChi.src = 'gender-picked.png';
    iconAnh.src = 'gender-notpicked.png';
  }
  checkForm();
}

const nameInput = document.getElementById('name');
const guestCountInput = document.getElementById('guestCount');
const phoneInput = document.getElementById('phone');
const submitBtn = document.getElementById('submitBtn');

function checkForm() {
  submitBtn.disabled = !(
    selectedGender &&
    nameInput.value.trim() &&
    guestCountInput.value.trim() &&
    phoneInput.value.trim()
  );
}

nameInput.addEventListener('input', checkForm);
guestCountInput.addEventListener('input', checkForm);
phoneInput.addEventListener('input', checkForm);

function updateSuccessBoxDisplay() {
  const langData = dictionary[currentLang];
  const translatedGender = selectedGender === 'Anh' ? langData.titleAnh : langData.titleChi;
  const guestCount = document.getElementById('guestCount').value.trim();
  
  // Ráp thông tin vào cấu trúc 3 cột mới gọn gàng
  document.getElementById('colNameVal').innerText = `${translatedGender} ${customerSubmittedName}`;
  document.getElementById('colCountVal').innerText = `${guestCount} ${langData.labelGuests}`;
  document.getElementById('colPhoneVal').innerText = customerSubmittedPhone;
}

submitBtn.addEventListener('click', async () => {
  const name = nameInput.value.trim();
  const guestCount = guestCountInput.value.trim();
  const phone = phoneInput.value.trim();
  const timestamp = Date.now();

  customerSubmittedName = name;
  customerSubmittedPhone = phone;

  const activeWaitingRef = db.ref(`queues/${today}/${storeKey}/waiting`);

  try {
    await activeWaitingRef.push({
      gender: selectedGender,
      name,
      guestCount,
      phone,
      createdAt: timestamp
    });

    // ẨN FORM ĐẶT BÀN
    document.getElementById('bookingFormWrapper').style.display = 'none';
    updateSuccessBoxDisplay();
    
    // HIỆN HỘP THÔNG BÁO VÀ KHU VỰC Ý KIẾN KHÁCH HÀNG
    document.getElementById('successMessage').style.display = 'block';
    document.getElementById('feedbackSectionWrapper').style.display = 'block';
    
    // THAY ĐỔI HÌNH NỀN VÀ ASSET TRANG TRÍ SANG PHẦN THÀNH CÔNG THÔNG MINH
    const container = document.getElementById('mainAppContainer');
    container.classList.remove('order-view');
    container.classList.add('success-view');

  } catch (error) {
    console.error("Lỗi:", error);
    alert(dictionary[currentLang].alertBookingError);
  }
});

document.getElementById('submitFeedbackBtn').addEventListener('click', async () => {
  const content = document.getElementById('feedbackContent').value.trim();
  if (!content) {
    alert(dictionary[currentLang].alertFeedbackEmpty);
    return;
  }

  const finalName = customerSubmittedName || nameInput.value.trim() || "";
  const finalPhone = customerSubmittedPhone || phoneInput.value.trim() || "";
  const finalGender = selectedGender || "";

  const activeFeedbackRef = db.ref(`feedbacks/${currentStore}`);

  try {
    await activeFeedbackRef.push({
      gender: finalGender,
      name: finalName,
      phone: finalPhone,
      content: content,
      createdAt: Date.now()
    });

    alert(dictionary[currentLang].alertFeedbackSuccess);
    document.getElementById('feedbackContent').value = '';
  } catch (error) {
    console.error("Lỗi:", error);
    alert(dictionary[currentLang].alertFeedbackError);
  }
});

switchLanguage(currentLang);
</script>
