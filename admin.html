<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Queue Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body {

  font-family: Arial;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f5f5f5;

}

.card {

  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;

}

.store-buttons {

  display: flex;
  gap: 10px;
  margin-bottom: 20px;

}

.store-btn {

  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;

}

.active {

  background: green;
  color: white;

}

.row {

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;

}

.serve-btn {

  background: green;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;

}

.restore-btn {

  background: #007bff;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;

}

</style>

</head>

<body>

<div class="card">

<div class="store-buttons" id="storeButtons"></div>

<h2 id="waitingTitle">

  Khách đang chờ

</h2>

<div id="waitingList"></div>

</div>

<div class="card">

<button id="toggleServed">

Hiện danh sách đã phục vụ

</button>

<div id="servedWrapper"
style="display:none">

<h2>Đã phục vụ</h2>

<div id="servedList"></div>

</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD_hZDfeIR575b7n5Cshp1VRZg2y--raiw",
  authDomain: "mykungfu-31485.firebaseapp.com",
  databaseURL: "https://mykungfu-31485-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mykungfu-31485",
  storageBucket: "mykungfu-31485.firebasestorage.app",
  messagingSenderId: "830853417821",
  appId: "1:830853417821:web:f336fb6f4cc7660b7d36b4"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const storeNames = {

  kungfu: 'Mì Kung Fu',
  musan: 'Lẩu Musan'

};

const params =
  new URLSearchParams(window.location.search);

const currentStore =
  params.get('store') || 'kungfu';

const today =
  new Date().toISOString().split('T')[0];

const queueRef =
  db.ref(`queues/${today}/${currentStore}`);


const storeButtons =
  document.getElementById('storeButtons');

Object.entries(storeNames)
.forEach(([key, name]) => {

  const btn =
    document.createElement('button');

  btn.className =
    'store-btn';

  if (key === currentStore) {

    btn.classList.add('active');

  }

  btn.innerText = name;

  btn.onclick = () => {

    window.location =
      `admin.html?store=${key}`;

  };

  storeButtons.appendChild(btn);

});

function formatDateTime(ts) {

  if (!ts) return '';

  return new Date(Number(ts))
    .toLocaleString('vi-VN');

}

queueRef.on('value', snapshot => {

  const data = snapshot.val() || {};

  const allList =
    Object.entries(data);

  const waitingList =
    allList
      .filter(([id, item]) => !item.served)
      .sort((a, b) =>
        a[1].createdAt - b[1].createdAt
      );

  const servedList =
    allList
      .filter(([id, item]) => item.served)
      .sort((a, b) =>
        b[1].served - a[1].served
      );

  const waitingDiv =
    document.getElementById('waitingList');

  const servedDiv =
    document.getElementById('servedList');

  waitingDiv.innerHTML = '';

  servedDiv.innerHTML = '';

  let totalGuests = 0;

  waitingList.forEach(([id, item]) => {

    totalGuests +=
      Number(item.guestCount || 0);

    const row =
      document.createElement('div');

    row.className = 'row';

    row.innerHTML = `

      <div>

        <strong>${item.name}</strong>

        |

        ${item.guestCount} khách

        |

        ${item.phone}

      </div>

      <button
        class="serve-btn"
        onclick="serveCustomer('${id}')"
      >

        Serve

      </button>

    `;

    waitingDiv.appendChild(row);

  });

  document.getElementById('waitingTitle')
    .innerText =

    `Khách đang chờ:
     ${waitingList.length} lượt
     (${totalGuests} khách)`;

  servedList.forEach(([id, item]) => {

    const row =
      document.createElement('div');

    row.className = 'row';

    row.innerHTML = `

      <div>

        <strong>${item.name}</strong>

        |

        ${item.guestCount} khách

        |

        ${item.phone}

        <br>

        Đặt:
        ${formatDateTime(item.createdAt)}

        |

        Serve:
        ${formatDateTime(item.served)}

      </div>

      <button
        class="restore-btn"
        onclick="restoreCustomer('${id}')"
      >

        ↻

      </button>

    `;

    servedDiv.appendChild(row);

  });

});

servedRef.on('value', snapshot => {

  const data = snapshot.val() || {};

  const list =
    Object.entries(data);

  const div =
    document.getElementById('servedList');

  div.innerHTML = '';

  list.forEach(([id, item]) => {

    const row =
      document.createElement('div');

    row.className = 'row';

    row.innerHTML = `

      <div>

        <strong>${item.name}</strong>

        |

        ${item.guestCount} khách

        |

        ${item.phone}

        <br>

        Đặt:
        ${formatTime(item.createdAt)}

        |

        Serve:
        ${formatTime(item.servedAt)}

      </div>

      <button
        class="restore-btn"
        onclick="restoreCustomer(
          '${id}',
          '${item.name}',
          '${item.guestCount}',
          '${item.phone}',
          '${item.createdAt}'
        )"
      >

        ↻

      </button>

    `;

    div.appendChild(row);

  });

});

async function serveCustomer(id) {

  await queueRef
    .child(id)
    .update({

      served: Date.now()

    });

}

async function restoreCustomer(id) {

  await queueRef
    .child(id)
    .update({

      served: null

    });

}

document.getElementById('toggleServed')
.onclick = () => {

  const wrapper =
    document.getElementById('servedWrapper');

  wrapper.style.display =

    wrapper.style.display === 'none'
      ? 'block'
      : 'none';

};

</script>

</body>
</html>
